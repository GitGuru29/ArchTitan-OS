# ── ArchTitan OS — hyprlock configuration ──────────────────────────────────
# "Rise, Titan" SDDM cinematic theme port with obsidian glass tile authentication card

$font = "Inter, JetBrainsMono Nerd Font, sans-serif"
$monoFont = "JetBrainsMono Nerd Font, monospace"

# Tokyo Night & Cyber Titan Palette
$accent = rgba(122, 162, 247, 1.0)
$accent_gradient = rgba(122, 162, 247, 0.9) rgba(187, 154, 247, 0.9) 45deg
$bg_tile = rgba(11, 14, 22, 0.72)
$bg_input = rgba(18, 22, 34, 0.85)
$border_tile = rgba(122, 162, 247, 0.35)
$text_primary = rgba(240, 243, 250, 1.0)
$text_muted = rgba(126, 133, 151, 1.0)
$text_dim = rgba(74, 81, 100, 1.0)
$fail_color = rgba(247, 118, 142, 1.0)
$check_color = rgba(158, 206, 106, 1.0)
$caps_color = rgba(224, 175, 104, 1.0)

general {
    hide_cursor = false
    grace = 0
    disable_loading_bar = true
    immediate_render = true
}

animations {
    enabled = true
    bezier = easeOutQuint, 0.23, 1, 0.32, 1
    animation = fadeIn, 1, 4, easeOutQuint
    animation = fadeOut, 1, 3, easeOutQuint
    animation = inputFieldDots, 1, 2, easeOutQuint
}

# ── Background (Atmospheric Carbon Haze & Blurred Wallpaper) ───────────────
background {
    monitor =
    path = /usr/share/backgrounds/archtitan/wallpaper.png
    blur_passes = 3
    blur_size = 7
    noise = 0.015
    contrast = 0.88
    brightness = 0.70
    vibrancy = 0.22
    color = rgb(7, 8, 11)
}

# ── Clock: Mechanical Large Digits (Matching SDDM) ─────────────────────────
label {
    monitor =
    text = $TIME
    color = $text_primary
    font_size = 78
    font_family = $monoFont
    font_weight = bold
    position = 0, 260
    halign = center
    valign = center

    shadow_passes = 3
    shadow_size = 8
    shadow_color = rgba(0, 0, 0, 0.65)
}

# ── Date: Clean Tracked Subtitle (Matching SDDM) ───────────────────────────
label {
    monitor =
    text = cmd[update:1000] date +"%A, %d %B %Y"
    color = $text_muted
    font_size = 14
    font_family = $monoFont
    position = 0, 195
    halign = center
    valign = center

    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 0.5)
}

# ── Floating Glass Tile Container (Card behind Password & Auth Area) ────────
shape {
    monitor =
    size = 360, 310
    color = $bg_tile
    rounding = 22
    border_size = 1
    border_color = $border_tile
    rotate = 0
    position = 0, -50
    halign = center
    valign = center

    shadow_passes = 3
    shadow_size = 22
    shadow_color = rgba(0, 0, 0, 0.55)
}

# ── Inside Glass Tile: ArchTitan Emblem / Logo ─────────────────────────────
image {
    monitor =
    path = /usr/share/pixmaps/archtitan-logo.png
    size = 64
    border_size = 0
    rounding = -1
    position = 0, 42
    halign = center
    valign = center

    shadow_passes = 2
    shadow_size = 6
    shadow_color = rgba(0, 0, 0, 0.5)
}

# ── Inside Glass Tile: Branding Header ─────────────────────────────────────
label {
    monitor =
    text = ARCHTITAN
    color = $text_muted
    font_size = 11
    font_family = $monoFont
    font_weight = bold
    position = 0, -4
    halign = center
    valign = center
}

# ── Inside Glass Tile: Welcome User ────────────────────────────────────────
label {
    monitor =
    text = Welcome back, $USER
    color = $text_primary
    font_size = 13.5
    font_family = $font
    font_weight = 600
    position = 0, -26
    halign = center
    valign = center
}

# ── Inside Glass Tile: Sleek Futuristic Password Pill ──────────────────────
input-field {
    monitor =
    size = 280, 46
    outline_thickness = 1.5
    rounding = 23

    dots_size = 0.28
    dots_spacing = 0.35
    dots_center = true

    inner_color = $bg_input
    outer_color = $accent_gradient
    check_color = $check_color
    fail_color = $fail_color
    capslock_color = $caps_color

    font_color = $text_primary
    fade_on_empty = false

    font_family = $monoFont
    placeholder_text = <span foreground="##4A5164">Enter password...</span>
    fail_text = <span foreground="##F7768E">Authentication failed</span>

    position = 0, -82
    halign = center
    valign = center

    shadow_passes = 2
    shadow_size = 8
    shadow_color = rgba(0, 0, 0, 0.45)
}

# ── Inside Glass Tile: Layout & Security Badge ─────────────────────────────
label {
    monitor =
    text = 󰌾  SECURED SESSION
    color = $text_dim
    font_size = 9.5
    font_family = $monoFont
    font_weight = bold
    position = 0, -132
    halign = center
    valign = center
}

# ── Bottom Screen Footer: Key Hints ────────────────────────────────────────
label {
    monitor =
    text = 󰌑 Enter to Unlock   •   Esc to Clear
    color = $text_dim
    font_size = 11
    font_family = $font
    position = 0, 36
    halign = center
    valign = bottom
}
