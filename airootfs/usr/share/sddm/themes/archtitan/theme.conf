[General]
# Ring Lighting Effect: "music" (Auto RGB on music playback), "rgb" (Always RGB), "monochrome" (Solid White), "accent" (Custom Color)
ringMode="music"

# Custom Ring Accent Color (used when ringMode="accent" or for solid highlights)
ringColor="#FFFFFF"

# Clock Display Format: "24h" or "12h"
clockFormat="24h"

# Spire Atmosphere: true / false
spireGlow=true
