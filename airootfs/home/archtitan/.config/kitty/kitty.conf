# ── ArchTitan OS — Kitty Terminal Configuration ───────────────────────────
# Modern frosted obsidian aesthetic with Catppuccin Mocha color scheme

# Typography
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.5

# Shell
shell fish

# Aesthetics & Glassmorphism
background_opacity         0.88
background_blur            32
hide_window_decorations    yes
window_padding_width       18 22
confirm_os_window_close    0

# Tab Bar
tab_bar_edge               top
tab_bar_style              powerline
tab_powerline_style        slanted
tab_bar_min_tabs           2
active_tab_foreground      #1E1E2E
active_tab_background      #89B4FA
active_tab_font_style      bold
inactive_tab_foreground    #7F849C
inactive_tab_background    #181825

# Cursor
cursor                     #f5c2e7
cursor_text_color          #1E1E2E
cursor_shape               beam
cursor_beam_thickness      1.8
cursor_blink_interval      0.5
cursor_stop_blinking_after 15.0

# Scrollback
scrollback_lines           10000
wheel_scroll_multiplier    3.0

# Catppuccin Mocha Palette
foreground                 #CDD6F4
background                 #1E1E2E
selection_foreground       #1E1E2E
selection_background       #f5c2e7

# Black
color0                     #45475A
color8                     #585B70

# Red
color1                     #F38BA8
color9                     #F38BA8

# Green
color2                     #A6E3A1
color10                    #A6E3A1

# Yellow
color3                     #F9E2AF
color11                    #F9E2AF

# Blue
color4                     #89B4FA
color12                    #89B4FA

# Magenta
color5                     #F5C2E7
color13                    #F5C2E7

# Cyan
color6                     #94E2D5
color14                    #94E2D5

# White
color7                     #cdd6f4
color15                     #A6ADC8
