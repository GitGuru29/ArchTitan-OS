# ── TITAN AI — Kitty integration ──────────────────────────────────────────────
# Ctrl+Shift+S opens a new Kitty window with a search prompt. Answers and
# source links appear in that window; your current shell is untouched.
# The C++ engine is called internally — no command needs to be typed.
map ctrl+shift+s launch --type=window --title=TITAN-AI-SEARCH /usr/local/bin/titan-ai-kitty
