# ArchTitan Live ISO — hypridle configuration
#
# NO timeouts are defined here. This file exists specifically so that the
# hypridle daemon launched from hyprland.lua autostart is a no-op on the
# live session:
#
# On the live ISO we NEVER want:
#   - screen blanking (DPMS off)
#   - hyprlock / screen locking (the live user has no password — locking
#     would strand the session)
#   - suspend (also blocked system-wide by archtitan-live-inhibit.service)
#
# Installed systems receive the real idle policy from /etc/skel instead
# (5 min blank / 10 min lock).

general {
    # Never lock on the live session — the live user has an empty password
    lock_cmd = :
    # Do not suspend at all
    before_sleep_cmd = :
    after_sleep_cmd = :
    # Ignore short idleness spikes (e.g. VM ACPI events)
    ignore_dbus_inhibit = false
}

# ── No timeout blocks ────────────────────────────────────────────────────────
# Intentionally empty — no blanking, no locking, no suspend while in live env.
