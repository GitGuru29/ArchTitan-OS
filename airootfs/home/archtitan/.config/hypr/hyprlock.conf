# ── ArchTitan OS — hyprlock configuration ──────────────────────────────────
# "Rise, Titan" SDDM Login Screen Mirror with Frosted Glass Auth Card
# Exact 1:1 spatial composition: Top-Left Clock, Left-Center Frosted Glass Card,
# Right-Center Compass Reticle HUD, and Clean Hyprland Session Locking.

$font = "Inter, JetBrainsMono Nerd Font, sans-serif"
$monoFont = "JetBrainsMono Nerd Font, monospace"

# titan-theme:begin
# generated by `titan-theme` — do not edit by hand
$accent = rgba(137, 180, 250, 1.00)
$accent_gradient = rgba(137, 180, 250, 0.90) rgba(203, 166, 247, 0.90) 45deg
$accent_soft = rgba(137, 180, 250, 0.95)
$bg_card = rgba(17, 17, 27, 0.78)
$bg_input = rgba(24, 24, 37, 0.90)
$bg_deep = rgb(17, 17, 27)
$border_card = rgba(137, 180, 250, 0.30)
$text_primary = rgba(205, 214, 244, 1.00)
$text_muted = rgba(166, 173, 200, 1.00)
$text_dim = rgba(108, 112, 134, 1.00)
$fail_color = rgba(243, 139, 168, 1.00)
$check_color = rgba(166, 227, 161, 1.00)
$caps_color = rgba(249, 226, 175, 1.00)
$on_accent = rgba(17, 17, 27, 1.00)
# titan-theme:end

general {
    hide_cursor = false
    grace = 0
    disable_loading_bar = true
    immediate_render = true
}

animations {
    enabled = true
    bezier = easeOutQuint, 0.23, 1, 0.32, 1
    animation = fadeIn, 1, 4, easeOutQuint
    animation = fadeOut, 1, 3, easeOutQuint
    animation = inputFieldDots, 1, 2, easeOutQuint
}

# ── Background (Atmospheric Carbon Haze & Blurred Wallpaper) ───────────────
background {
    monitor =
    path = /usr/share/backgrounds/archtitan/wallpaper.png
    blur_passes = 3
    blur_size = 7
    noise = 0.015
    contrast = 0.88
    brightness = 0.70
    vibrancy = 0.22
    color = $bg_deep
}

# ── Right Side: Majestic Compass Reticle Centerpiece (Matching SDDM) ──────
image {
    monitor =
    path = /usr/share/pixmaps/archtitan-reticle-logo.png
    size = 640
    border_size = 0
    rounding = 0
    position = -120, 0
    halign = right
    valign = center

    shadow_passes = 3
    shadow_size = 22
    shadow_color = rgba(0, 0, 0, 0.70)
}

# ── Top-Left: Mechanical Large Digits Clock (Matching SDDM) ────────────────
label {
    monitor =
    text = $TIME
    color = $text_primary
    font_size = 76
    font_family = $monoFont
    font_weight = bold
    position = 160, -90
    halign = left
    valign = top

    shadow_passes = 3
    shadow_size = 8
    shadow_color = rgba(0, 0, 0, 0.65)
}

# ── Top-Left: Date Tracked Subtitle (Matching SDDM) ────────────────────────
label {
    monitor =
    text = cmd[update:1000] date +"%A, %d %B %Y"
    color = $text_muted
    font_size = 14
    font_family = $monoFont
    position = 160, -182
    halign = left
    valign = top

    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 0.50)
}

# ── Left-Center: Frosted Glass Auth Card (Matching SDDM Auth Container) ───
shape {
    monitor =
    size = 350, 310
    color = $bg_card
    rounding = 16
    border_size = 1
    border_color = $border_card
    position = 160, -235
    halign = left
    valign = top

    shadow_passes = 3
    shadow_size = 20
    shadow_color = rgba(0, 0, 0, 0.55)
}

# ── Inside Grounded Pedestal: ArchTitan Compass Reticle Emblem ─────────────
image {
    monitor =
    path = /usr/share/pixmaps/archtitan-reticle-logo.png
    size = 96
    border_size = 0
    rounding = 0
    position = 0, 272
    halign = center
    valign = bottom

    shadow_passes = 2
    shadow_size = 8
    shadow_color = rgba(0, 0, 0, 0.5)
}

# ── Card Header: Branding ──────────────────────────────────────────────────
label {
    monitor =
    text = ARCHTITAN
    color = $text_muted
    font_size = 11
    font_family = $monoFont
    font_weight = bold
    position = 0, 218
    halign = center
    valign = bottom
}

# ── Card Body: User Identifier Display ────────────────────────────────────
label {
    monitor =
    text =   $USER
    color = $text_primary
    font_size = 13.5
    font_family = $monoFont
    font_weight = 600
    position = 0, 196
    halign = center
    valign = bottom
}

# ── Card Body: Password Typing Area ────────────────────────────────────────
input-field {
    monitor =
    size = 300, 46
    outline_thickness = 1.5
    rounding = 10

    dots_size = 0.28
    dots_spacing = 0.35
    dots_center = true

    inner_color = $bg_input
    outer_color = $accent_gradient
    check_color = $check_color
    fail_color = $fail_color
    capslock_color = $caps_color

    font_color = $text_primary
    fade_on_empty = false

    font_family = $monoFont
    placeholder_text = <span foreground="##6C7086">Password</span>
    fail_text = <span foreground="##F38BA8">!! AUTH FAILED</span>

    position = 185, -345
    halign = left
    valign = top

    shadow_passes = 2
    shadow_size = 8
    shadow_color = rgba(0, 0, 0, 0.45)
}

# ── Card Body: High-Contrast "ENTER SESSION" Action Button ─────────────────
shape {
    monitor =
    size = 300, 42
    color = $accent_soft
    rounding = 8
    border_size = 0
    position = 185, -415
    halign = left
    valign = top

    shadow_passes = 2
    shadow_size = 6
    shadow_color = rgba(0, 0, 0, 0.35)
}

label {
    monitor =
    text = ENTER SESSION
    color = $on_accent
    font_size = 11
    font_family = $monoFont
    font_weight = bold
    position = 280, -428
    halign = left
    valign = top
}

# ── Bottom of Card: Unlock / Clear Key Hints ──────────────────────────────
label {
    monitor =
    text = 󰌑 Enter to Unlock   •   Esc to Clear
    color = $text_dim
    font_size = 10.5
    font_family = $monoFont
    position = 185, -480
    halign = left
    valign = top
}

# ── Bottom-Right: System & Session Status (Matching SDDM Controls Bar) ────
label {
    monitor =
    text = 󰌾 Hyprland Secure Session
    color = $text_dim
    font_size = 10.5
    font_family = $monoFont
    position = -120, 28
    halign = right
    valign = bottom
}
