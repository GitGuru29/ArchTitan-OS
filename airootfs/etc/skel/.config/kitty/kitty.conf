# ── ArchTitan OS — Kitty Terminal Configuration ───────────────────────────
# Modern frosted obsidian aesthetic; colours come from the titan-theme

# Typography
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.5

# Shell
shell fish

# Aesthetics & Glassmorphism
background_opacity         0.88
background_blur            32
hide_window_decorations    yes
window_padding_width       18 22
confirm_os_window_close    0

# Tab Bar
tab_bar_edge               top
tab_bar_style              powerline
tab_powerline_style        slanted
tab_bar_min_tabs           2
active_tab_font_style      bold

# Cursor
cursor_shape               beam
cursor_beam_thickness      1.8
cursor_blink_interval      0.5
cursor_stop_blinking_after 15.0

# Scrollback
scrollback_lines           10000
wheel_scroll_multiplier    3.0

# Theme colours — per-theme fragment written by `titan-theme`
include current-theme.conf
