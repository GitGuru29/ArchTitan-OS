# ── ArchTitan OS — Kitty Terminal Configuration ───────────────────────────
# Modern frosted obsidian aesthetic with Tokyo Night color scheme

# Typography
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.5

# Shell
shell fish

# Aesthetics & Glassmorphism
background_opacity         0.88
background_blur            32
hide_window_decorations    yes
window_padding_width       18 22
confirm_os_window_close    0

# Tab Bar
tab_bar_edge               top
tab_bar_style              powerline
tab_powerline_style        slanted
tab_bar_min_tabs           2
active_tab_foreground      #0B0E14
active_tab_background      #7AA2F7
active_tab_font_style      bold
inactive_tab_foreground    #7A889B
inactive_tab_background    #15161E

# Cursor
cursor                     #C0CAF5
cursor_text_color          #0B0E14
cursor_shape               beam
cursor_beam_thickness      1.8
cursor_blink_interval      0.5
cursor_stop_blinking_after 15.0

# Scrollback
scrollback_lines           10000
wheel_scroll_multiplier    3.0

# Tokyo Night Obsidian Palette
foreground                 #C0CAF5
background                 #0B0E14
selection_foreground       #0B0E14
selection_background       #7AA2F7

# Black
color0                     #15161E
color8                     #414868

# Red
color1                     #F7768E
color9                     #F7768E

# Green
color2                     #9ECE6A
color10                    #9ECE6A

# Yellow
color3                     #E0AF68
color11                    #E0AF68

# Blue
color4                     #7AA2F7
color12                    #7AA2F7

# Magenta
color5                     #BB9AF7
color13                    #BB9AF7

# Cyan
color6                     #7DCFFF
color14                    #7DCFFF

# White
color7                     #A9B1D6
