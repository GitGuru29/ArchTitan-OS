# ArchTitan Default Hyprland Config

# Monitor setup
monitor=,preferred,auto,1

# Input
input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0
    touchpad {
        natural_scroll = yes
        tap-to-click = true
    }
}

# Programs
$terminal = kitty
$menu = titan-menu --toggle
$browser = titanbrowser
$filemanager = $terminal -e ranger

# Sandbox exec wrapper
# Routes all user app launches through titan-sandboxd policy resolution.
# System daemons (exec-once) are intentionally excluded — they must not be boxed.
$sandboxed = titan-exec-hook

# Environment
env = XCURSOR_SIZE,24
env = QT_QPA_PLATFORMTHEME,qt5ct
env = WLR_NO_HARDWARE_CURSORS,1
env = WLR_RENDERER_ALLOW_SOFTWARE,1
env = AQ_NO_MODIFIERS,1

cursor {
    no_hardware_cursors = true
    enable_hyprcursor = true
    sync_gsettings_theme = true
}

# Autostart
exec-once = bash -c 'sleep 2 && waybar'
exec-once = bash -c 'sleep 3 && titan-media-hud'
exec-once = titan-wallpaper-restore
exec-once = bash -c 'sleep 3 && titan-quicksettings --daemon'
exec-once = bash -c 'sleep 3 && titan-menu --daemon'
exec-once = bash -c 'sleep 3 && titan-workspace-hud --daemon'
exec-once = bash -c 'sleep 3 && titan-spotlight --daemon'
exec-once = titan-hotzones
exec-once = titan-zone-osd
exec-once = swayosd-server
exec-once = /usr/lib/polkit-kde-authentication-agent-1
exec-once = xdg-user-dirs-update

# Keybindings (Matched to Host OS Cheat Sheet)
$mainMod = SUPER

# Shell & Utilities (ArchTitan Central Command Palette & Spotlight)
bindr = , SUPER_L, exec, titan-spotlight --toggle  # Windows/Super key tap opens macOS-style Spotlight Launcher
bindr = , SUPER_R, exec, titan-spotlight --toggle
bind = $mainMod, Space, exec, titan-menu --toggle       # Super+Space: ArchTitan Central Menu
bind = $mainMod, Tab, exec, titan-workspace-hud --toggle # Super+Tab: 10-Workspace HUD Shower
bind = $mainMod, D, exec, titan-spotlight --toggle      # Super+D: App Launcher (Spotlight)
bind = $mainMod, R, exec, titan-spotlight --toggle      # Super+R: Secondary App runner (Spotlight)
bind = $mainMod, slash, exec, titan-menu --toggle       # Help & Shortcuts Cheat Sheet (Super+/)
bind = $mainMod, question, exec, titan-menu --toggle    # Super+?
bind = $mainMod, F1, exec, titan-menu --toggle          # Help & Shortcuts Cheat Sheet (Super+F1)
bind = $mainMod, V, exec, titan-spotlight --clipboard   # Clipboard History Manager
bind = $mainMod, Period, exec, titan-spotlight --toggle # Quick Emoji / symbols runner
bind = $mainMod, backslash, exec, titan-wallpaper-picker # Wallpaper Picker (Super+\)
bind = $mainMod SHIFT, backslash, exec, titan-wallpaper-picker # Wallpaper Picker (Super+|)
bind = $mainMod SHIFT, S, exec, titan-screenshot --area # Screen snip
bind = , Print, exec, titan-screenshot --area
bind = $mainMod, Print, exec, titan-screenshot --full
bind = $mainMod ALT, Print, exec, titan-screenshot --window
bind = $mainMod, N, exec, titan-quicksettings --toggle # Quick Settings & Notification Center

# Session & Power
bind = $mainMod, Escape, exec, titan-powermenu
bind = CTRL ALT, Delete, exec, titan-powermenu
bind = $mainMod ALT, L, exec, pidof hyprlock || hyprlock || swaylock -f -c 0b0e14 || loginctl lock-session
bind = CTRL ALT, L, exec, pidof hyprlock || hyprlock || swaylock -f -c 0b0e14 || loginctl lock-session
bind = $mainMod SHIFT, L, exec, systemctl suspend -i || loginctl suspend # Sleep

# THM (Titan Hardware Manager) — discoverability
bind = $mainMod SHIFT, H, exec, $sandboxed $terminal -e sh -c 'clear; echo "Titan Hardware Manager (THM) — Quick View"; echo; titan-hwm status; echo; echo "---"; titan-hwm scan | tail -40; echo; echo "Type q to close or run: titan-hwm help"; read -r _'
bind = $mainMod SHIFT, T, exec, $sandboxed $terminal -e sh -c 'titan-hwm top 15; echo; echo "Press Enter to close..."; read -r _'

# Apps
bind = $mainMod, Return, exec, $sandboxed $terminal       # Terminal
bind = $mainMod, KP_Enter, exec, $sandboxed $terminal     # Terminal (Keypad Enter)
bind = $mainMod, T, exec, $sandboxed $terminal            # Terminal (Super+T)
bind = $mainMod, E, exec, $sandboxed $filemanager          # File manager
bind = $mainMod, W, exec, $sandboxed $browser              # Browser
bind = $mainMod, B, exec, $sandboxed $browser              # Browser (Super+B)
bind = $mainMod, C, exec, $sandboxed code                  # Code editor
bind = $mainMod, X, exec, $sandboxed $terminal -e nano     # Text editor
bind = CTRL $mainMod, V, exec, $sandboxed pavucontrol       # Volume mixer
bind = CTRL SHIFT, Escape, exec, $sandboxed $terminal -e btop # Task manager
bind = $mainMod, comma, exec, $sandboxed archtitan-settings # Settings panel shortcut
bind = $mainMod, I, exec, bash -c 'if [ -d /run/archiso ]; then launch-installer; else titan-exec-hook archtitan-settings; fi' # Installer on Live ISO / Settings on Installed OS

# Window Management
bind = $mainMod, Q, killactive,                # Close
bind = $mainMod SHIFT, Q, killactive,          # Close (Super+Shift+Q)
bind = ALT, F4, killactive,                    # Close (Alt+F4)
bind = $mainMod SHIFT ALT, Q, exec, hyprctl kill # Forcefully zap a window
bind = $mainMod SHIFT, Space, togglefloating,  # Float/Tile (Super+Shift+Space)
bind = $mainMod ALT, Space, togglefloating,    # Float/Tile (Super+Alt+Space)
bind = $mainMod, F, fullscreen, 0              # Fullscreen
bind = $mainMod SHIFT, F, fullscreen, 1        # Maximize (fullscreen with gaps)
bind = $mainMod, P, layoutmsg, togglesplit     # Super+P: Toggle dwindle split
bind = $mainMod SHIFT, P, exec, titan-cycle-power # Super+Shift+P: Cycle power profile

# Move Focus (Arrow keys & Vim H/J/K/L)
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d

# Move Window (Arrow keys & Vim Shift+H/J/K/L)
bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d
bind = $mainMod SHIFT, H, movewindow, l
bind = $mainMod SHIFT, L, movewindow, r
bind = $mainMod SHIFT, K, movewindow, u
bind = $mainMod SHIFT, J, movewindow, d

# Workspaces
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Focus Workspace Left/Right
bind = CTRL $mainMod, left, workspace, e-1
bind = CTRL $mainMod, right, workspace, e+1
bind = $mainMod, Page_Down, workspace, e+1
bind = $mainMod, Page_Up, workspace, e-1
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Scratchpad
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod ALT, S, movetoworkspace, special:magic

# Mouse bindings
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Touchpad gestures (native Hyprland engine, no plugin).
# NOTE: on Hyprland >= 0.55 the authoritative config is hyprland.lua; this block
# only applies to pre-0.55 hyprlang builds.
gesture = 3, horizontal, workspace
gesture = 4, horizontal, workspace
gesture = 3, down, close
gesture = 3, up, dispatcher, exec, $sandboxed $menu
gesture = 4, up, special, magic
gesture = 4, down, special, showdesktop

# One swipe = one workspace step (r+1/r-1 count empty workspaces; see hyprland.lua)
gestures {
    workspace_swipe_use_r = true
    workspace_swipe_create_new = true
    workspace_swipe_forever = false
    workspace_swipe_direction_lock = true
    workspace_swipe_min_speed_to_force = 10
}

# General appearance
general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = rgba(00d2ffee) rgba(38bdf8ee) 45deg
    col.inactive_border = rgba(1e263888)
    layout = dwindle
    resize_on_border = true
    hover_icon_on_border = true
}

# Decoration — dual-kawase blur, obsidian glass, soft drop shadows
decoration {
    rounding = 12

    active_opacity = 0.98
    inactive_opacity = 0.92
    fullscreen_opacity = 1.0

    blur {
        enabled = true
        size = 8
        passes = 4
        new_optimizations = true
        ignore_opacity = true
        xray = false
        noise = 0.020
        contrast = 1.05
        brightness = 1.02
        vibrancy = 0.42
        vibrancy_darkness = 0.12
        popups = true
    }

    shadow {
        enabled = true
        range = 28
        render_power = 4
        offset = 0, 6
        color = rgba(0b0e14aa)
        color_inactive = rgba(0b0e1455)
    }

    dim_inactive = true
    dim_strength = 0.05
}

# Animations — fluid physics & cubic-bezier easing
animations {
    enabled = yes

    bezier = fluent_decel, 0.05, 0.9, 0.1, 1.05
    bezier = easeOutQuint, 0.23, 1, 0.32, 1
    bezier = easeInOutCubic, 0.65, 0, 0.35, 1
    bezier = overshot, 0.05, 0.9, 0.1, 1.1
    bezier = snappy, 0.1, 1, 0.1, 1
    bezier = smooth, 0.25, 1, 0.5, 1
    bezier = spring, 0.34, 1.3, 0.64, 1

    animation = windows, 1, 3.2, fluent_decel, popin 82%
    animation = windowsOut, 1, 2.6, easeInOutCubic, popin 88%
    animation = windowsMove, 1, 3.0, fluent_decel
    animation = border, 1, 5, easeOutQuint
    animation = borderangle, 1, 30, default, loop
    animation = fade, 1, 3.0, smooth
    animation = fadeDim, 1, 3.5, smooth
    animation = workspaces, 1, 3.6, fluent_decel, slide
    animation = specialWorkspace, 1, 3.6, fluent_decel, slidevert
    animation = layers, 1, 3.0, fluent_decel, popin 90%
    animation = layersIn, 1, 2.8, fluent_decel, popin 90%
    animation = layersOut, 1, 2.4, easeInOutCubic, popin 92%
}

# Layout
dwindle {
    preserve_split = yes
    force_split = 2
}

# Misc
misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    animate_manual_resizes = true
    animate_mouse_windowdragging = true
    key_press_enables_dpms = true
    mouse_move_enables_dpms = true
}

# DPMS screen management
exec-once = bash -c 'sleep 2; which wlopm >/dev/null 2>&1 && wlopm --on DP-1 --on HDMI-A-1 --on Virtual-1 || true'
bind = , XF86Sleep, exec, :   # swallow sleep key on live ISO

# ArchTitan Media Island — SUPER+M toggle
bind = $mainMod, M, exec, titan-media-hud --toggle

# Media keys (XF86) & SwayOSD OSD bindings
bind = , XF86AudioPlay, exec, playerctl play-pause
bind = , XF86AudioNext, exec, playerctl next
bind = , XF86AudioPrev, exec, playerctl previous
binde = , XF86AudioRaiseVolume, exec, swayosd-client --output-volume raise
binde = , XF86AudioLowerVolume, exec, swayosd-client --output-volume lower
bind = , XF86AudioMute, exec, swayosd-client --output-volume mute-toggle
bind = , XF86AudioMicMute, exec, swayosd-client --input-volume mute-toggle
binde = , XF86MonBrightnessUp, exec, swayosd-client --brightness raise
binde = , XF86MonBrightnessDown, exec, swayosd-client --brightness lower
bindr = , Caps_Lock, exec, swayosd-client --caps-lock

# VM / keyboard fallbacks without XF86 keys
binde = $mainMod, F12, exec, swayosd-client --output-volume raise
binde = $mainMod, F11, exec, swayosd-client --output-volume lower
bind = $mainMod, F10, exec, swayosd-client --output-volume mute-toggle
binde = $mainMod, F6, exec, swayosd-client --brightness raise
binde = $mainMod, F5, exec, swayosd-client --brightness lower

# Layer Rules (Frosted Glass UI on Waybar, Rofi, SwayNC, Quick Settings)
layerrule = blur, waybar
layerrule = ignorezero, waybar
layerrule = blur, titan-spotlight
layerrule = ignorezero, titan-spotlight
layerrule = match:namespace titan-spotlight, blur on
layerrule = match:namespace titan-spotlight, ignore_alpha 0.05
layerrule = blur, titan-powermenu
layerrule = ignorezero, titan-powermenu
layerrule = match:namespace titan-powermenu, blur on
layerrule = match:namespace titan-powermenu, ignore_alpha 0.05
layerrule = blur, swaync-control-center
layerrule = ignorezero, swaync-control-center
layerrule = blur, swaync-notification-window
layerrule = ignorezero, swaync-notification-window
layerrule = blur, titan-quicksettings
layerrule = ignorezero, titan-quicksettings
layerrule = match:namespace titan-quicksettings, blur on
layerrule = match:namespace titan-quicksettings, ignore_alpha 0.05
layerrule = match:namespace titan-quicksettings-blur, blur on
layerrule = match:namespace titan-quicksettings-blur, ignore_alpha 0.05
layerrule = blur, titan-menu
layerrule = ignorezero, titan-menu
layerrule = match:namespace titan-menu, blur on
layerrule = match:namespace titan-menu, ignore_alpha 0.05
layerrule = blur, titan-workspace-hud
layerrule = ignorezero, titan-workspace-hud
layerrule = match:namespace titan-workspace-hud, blur on
layerrule = match:namespace titan-workspace-hud, ignore_alpha 0.05
layerrule = match:namespace titan-zone-osd, no_anim on
layerrule = blur, swayosd
layerrule = ignorezero, swayosd
layerrule = match:namespace swayosd, blur on
layerrule = match:namespace swayosd, ignore_alpha 0.05

# Window Rules (Smart floating geometries for utility apps)
windowrulev2 = float, class:^(pavucontrol)$
windowrulev2 = size 720 500, class:^(pavucontrol)$
windowrulev2 = center, class:^(pavucontrol)$

windowrulev2 = float, class:^(archtitan-settings)$
windowrulev2 = size 960 620, class:^(archtitan-settings)$
windowrulev2 = center, class:^(archtitan-settings)$

windowrulev2 = float, class:^(titan-wallpaper-picker)$
windowrulev2 = center, class:^(titan-wallpaper-picker)$

windowrulev2 = float, class:^(nm-connection-editor)$
windowrulev2 = float, class:^(blueman-manager)$

windowrulev2 = float, class:^(kitty)$, title:^(btop)$
windowrulev2 = size 1020 660, class:^(kitty)$, title:^(btop)$
windowrulev2 = center, class:^(kitty)$, title:^(btop)$

windowrulev2 = float, class:^(calamares)$
windowrulev2 = size 980 640, class:^(calamares)$
windowrulev2 = center, class:^(calamares)$

windowrulev2 = float, title:^(Open File|Open Folder|Save File|Confirm to replace files)$
windowrulev2 = float, title:^(Picture-in-Picture)$
windowrulev2 = pin, title:^(Picture-in-Picture)$

# Terminal subtle glass transparency
windowrulev2 = opacity 0.94 0.88, class:^(kitty)$

# THM onboarding
exec-once = bash -c 'sleep 5 && command -v titan-thm-first-run >/dev/null && titan-thm-first-run'



