# ── ArchTitan OS — hyprlock configuration ──────────────────────────────────
# Tokyo Night & Obsidian glass aesthetic matching ArchTitan desktop theme

$font = "Inter, JetBrainsMono Nerd Font, sans-serif"
$accent = rgba(122, 162, 247, 1.0)
$accent_grad = rgba(122, 162, 247, 1.0) rgba(187, 154, 247, 1.0) 45deg
$bg_input = rgba(18, 22, 33, 0.75)
$text_primary = rgba(226, 232, 240, 1.0)
$text_muted = rgba(122, 136, 155, 1.0)
$fail_color = rgba(239, 68, 68, 1.0)

general {
    hide_cursor = false
    grace = 0
    disable_loading_bar = true
}

animations {
    enabled = true
    bezier = easeOutQuint, 0.23, 1, 0.32, 1
    animation = fadeIn, 1, 4, easeOutQuint
    animation = fadeOut, 1, 3, easeOutQuint
    animation = inputFieldDots, 1, 2, easeOutQuint
}

# ── Background ───────────────────────────────────────────────────────────────
background {
    monitor =
    path = /usr/share/backgrounds/archtitan/wallpaper.png
    blur_passes = 2
    blur_size = 7
    noise = 0.015
    contrast = 0.89
    brightness = 0.80
    vibrancy = 0.20
    color = rgb(11, 14, 20)
}

# ── Clock (Large Digital Time) ───────────────────────────────────────────────
label {
    monitor =
    text = $TIME
    color = $text_primary
    font_size = 90
    font_family = $font
    font_weight = bold
    position = 0, 160
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 0.5)
}

# ── Date ─────────────────────────────────────────────────────────────────────
label {
    monitor =
    text = cmd[update:1000] date +"%A, %B %d, %Y"
    color = $text_muted
    font_size = 18
    font_family = $font
    position = 0, 90
    halign = center
    valign = center
    shadow_passes = 1
    shadow_size = 2
    shadow_color = rgba(0, 0, 0, 0.4)
}

# ── ArchTitan OS Emblem / Subtitle ───────────────────────────────────────────
label {
    monitor =
    text = 󰣇  ArchTitan OS
    color = $accent
    font_size = 14
    font_family = $font
    position = 0, 40
    halign = center
    valign = center
    shadow_passes = 1
    shadow_size = 2
    shadow_color = rgba(0, 0, 0, 0.4)
}

# ── Password Input Field ────────────────────────────────────────────────────
input-field {
    monitor =
    size = 280, 52
    outline_thickness = 2
    dots_size = 0.28
    dots_spacing = 0.35
    dots_center = true

    inner_color = $bg_input
    outer_color = $accent_grad
    check_color = rgba(115, 218, 202, 1.0)
    fail_color = $fail_color

    font_color = $text_primary
    fade_on_empty = false
    rounding = 26

    font_family = $font
    placeholder_text = <span foreground="##7A889B">Enter Password...</span>
    fail_text = <span foreground="##EF4444">Authentication Failed</span>

    position = 0, -50
    halign = center
    valign = center

    shadow_passes = 2
    shadow_size = 6
    shadow_color = rgba(0, 0, 0, 0.4)
}
