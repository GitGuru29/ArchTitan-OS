# ArchTitan — hypridle configuration (installed systems)
#
# Launched from hyprland.lua autostart. This file ships via /etc/skel to
# every installed system and provides the premium idle policy:
#   5 min  -> display blanks (DPMS off)
#   10 min -> session locks (hyprlock)
# Suspend-on-lid is handled by systemd-logind (HandleLidSwitch).
#
# The live-ISO variant of this file deliberately defines NO timeouts:
# the installer session must never blank or lock.

general {
    # Lock command triggered by loginctl lock-session or shortcuts
    lock_cmd = pidof hyprlock || hyprlock || swaylock -f -c 11111b
    # Always lock before suspending so the desktop is never exposed on resume
    before_sleep_cmd = loginctl lock-session
    # Wake from sleep with the display back on
    after_sleep_cmd = hyprctl dispatch dpms on
    # Honour app idle inhibitors (video players, presentations, ...)
    ignore_dbus_inhibit = false
}

# ── 5 minutes: blank the display ────────────────────────────────────────────
listener {
    timeout = 300
    on_timeout = hyprctl dispatch dpms off
}

# ── 10 minutes: lock the session ────────────────────────────────────────────
listener {
    timeout = 600
    on_timeout = loginctl lock-session
}
